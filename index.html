<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnny's Crunchyroll Account</title>
  <style>
    /* Premium Animated Background Layer */
    body {
      background-color: #141519;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Subtle glowing cosmic background pulse */
    body::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(244, 117, 33, 0.08) 0%, transparent 60%);
      animation: superPulse 8s ease-in-out infinite;
      z-index: 1;
    }

    /* Ultra-Smooth Card Reveal Animation */
    .card {
      background-color: #23252b;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 30px rgba(244, 117, 33, 0.05);
      border-top: 6px solid #f47521;
      position: relative;
      z-index: 2;
      transform: translateY(30px);
      opacity: 0;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h2 {
      color: #f47521;
      margin-bottom: 10px;
      font-size: 28px;
      letter-spacing: 0.5px;
      animation: textGlow 3s ease-in-out infinite alternate;
    }

    p.subtitle {
      color: #a0a5b5;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* Input Field with Hover and Glow transitions */
    input[type="text"] {
      width: 88%;
      padding: 15px;
      background-color: #141519;
      border: 2px solid #3a3f4b;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    input[type="text"]:focus {
      border-color: #f47521;
      box-shadow: 0 0 15px rgba(244, 117, 33, 0.3);
      transform: scale(1.02);
      outline: none;
    }

    /* Fluid Kinetic Button */
    button {
      background-color: #f47521;
      color: black;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 96%;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(244, 117, 33, 0.2);
    }

    button:hover {
      background-color: #ff8533;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(244, 117, 33, 0.4);
    }

    button:active {
      transform: translateY(1px);
    }

    /* Circular Loading Spinner */
    .spinner-container {
      display: none;
      justify-content: center;
      margin-top: 20px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #3a3f4b;
      border-top: 4px solid #f47521;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Dramatic Slide-Down & Pop Reveal Box */
    .secret-box {
      display: none;
      background-color: #141519;
      border: 2px dashed #f47521;
      padding: 22px;
      margin-top: 25px;
      border-radius: 10px;
      text-align: left;
      opacity: 0;
      transform: scale(0.9) translateY(-10px);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .secret-box.show {
      display: block;
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .credential-row {
      margin: 12px 0;
      font-size: 15px;
      opacity: 0;
      transform: translateX(-10px);
    }

    /* Staggered text presentation once unlocked */
    .secret-box.show .credential-row {
      animation: revealText 0.4s ease forwards;
    }
    .secret-box.show .credential-row:nth-child(2) { animation-delay: 0.15s; }
    .secret-box.show .credential-row:nth-child(3) { animation-delay: 0.3s; }

    /* Pure CSS Keyframe System */
    @keyframes cardEntrance {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes superPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes textGlow {
      from { text-shadow: 0 0 5px rgba(244, 117, 33, 0.2); }
      to { text-shadow: 0 0 15px rgba(244, 117, 33, 0.6); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    @keyframes revealText {
      to { opacity: 1; transform: translateX(0); }
    }

    .shake-animation {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    .error {
      display: none;
      color: #ff4444;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="card" id="mainCard">
  <h2>Johnny's crunchyroll account</h2>
  <p class="subtitle">Enter your invite code to unlock premium streaming access.</p>
  
  <input type="text" id="inviteCode" placeholder="ENTER ACCESS CODE">
  <button id="unlockBtn" onclick="processUnlock()">Unlock Login</button>

  <div class="spinner-container" id="loadingSpinner"><div class="spinner"></div></div>
  <p id="errorMsg" class="error">❌ Invalid Passcode - Try Again</p>

  <div id="credentials" class="secret-box">
    <p style="color: #f47521; margin-top: 0; font-weight: bold; font-size: 16px;" class="credential-row">🎉 ACCESS GRANTED</p>
    <div class="credential-row">
      <strong>Email:</strong> <span id="displayEmail" style="color: #a0a5b5; margin-left: 5px;"></span>
    </div>
    <div class="credential-row">
      <strong>Password:</strong> <span id="displayPassword" style="color: #a0a5b5; margin-left: 5px;"></span>
    </div>
  </div>
</div>

<script>
  // Active web Firebase configurations
  const firebaseConfig = {
    apiKey: "AIzaSyB-e5_KWzSnmE_QEUmW5kB25hMciktv_EU",
    authDomain: "crunchypass-5a337.firebaseapp.com",
    projectId: "crunchypass-5a337",
    storageBucket: "crunchypass-5a337.firebasestorage.app",
    messagingSenderId: "387887634118",
    appId: "1:387887634118:web:5cfbcf10769cea031369c7",
    measurementId: "G-H9L83GJ74L"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function processUnlock() {
    const userEntered = document.getElementById("inviteCode").value.trim().toUpperCase();
    const card = document.getElementById("mainCard");
    const credsBox = document.getElementById("credentials");
    const errorBox = document.getElementById("errorMsg");
    const spinner = document.getElementById("loadingSpinner");
    const button = document.getElementById("unlockBtn");

    // Reset layouts dynamically
    errorBox.style.display = "none";
    credsBox.classList.remove("show");
    card.classList.remove("shake-animation");
    
    // Hide action triggers and spin up the loader
    button.style.display = "none";
    spinner.style.display = "flex";

    db.collection("vault").doc(userEntered).get().then((doc) => {
      setTimeout(() => {
        spinner.style.display = "none";
        button.style.display = "block";

        if (doc.exists) {
          const data = doc.data();
          document.getElementById("displayEmail").innerText = data.email;
          document.getElementById("displayPassword").innerText = data.password;
          credsBox.classList.add("show");
        } else {
          errorBox.style.display = "block";
          // Trigger a clean restart on the CSS shake keyframes
          void card.offsetWidth; 
          card.classList.add("shake-animation");
        }
      }, 800);
    }).catch((error) => {
      console.error("Database connection error: ", error);
      spinner.style.display = "none";
      button.style.display = "block";
      errorBox.style.display = "block";
      void card.offsetWidth;
      card.classList.add("shake-animation");
    });
  }
</script>

</body>
</html>
